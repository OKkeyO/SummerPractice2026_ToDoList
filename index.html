<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>ToDoList</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
<div class="container">
    <header>
        <div class="logo">
            <img src="/images/SenlaLogo.png" alt="Senla Logo">
        </div>
        <form class="searchbar" action="/search">
            <label>
                <input class="searchbar__input" type="text" name="search" placeholder="Search task for to do">
            </label>
        </form>
    </header>
    <main>
        <nav class="navbar">
            <ul class="nav_list">
                <li class="nav_item"><a class="nav_link" href="#">All</a></li>
                <li class="nav_item"><a class="nav_link" href="#">Active</a></li>
                <li class="nav_item"><a class="nav_link" href="#">Done</a></li>
            </ul>
        </nav>
        <div class="new_task">
            <form class="add_new_task" action="/addTask">
                <label for="newTask">New Task</label>
                <textarea id="newTask" cols="100" rows="10"></textarea>
                <input class="add_new_task__button" type="submit" value="Add"/>
            </form>
        </div>
        <div class="task_list">
            <ul class="task_list">
                <li class="task">
                    <div class="task_info">
                        <span>Complete todo list</span>
                    </div>
                    <button class="task_important">Mark Important</button>
                    <button class="task_delete">Delete</button>
                </li>
            </ul>
        </div>
    </main>
</div>
</body>
</html>
