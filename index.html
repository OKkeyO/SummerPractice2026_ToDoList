<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>ToDoList</title>

    <script src="https://kit.fontawesome.com/bcc2fd2fa3.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
<div class="container">
    <header>
        <div>
            <img src="/images/SenlaLogo.png" alt="Senla Logo" class="logo">
        </div>
        <form class="searchbar" action="/search">
            <i class="fa-solid fa-magnifying-glass"></i>
            <label>
                <input class="searchbar__input" type="text" name="search" placeholder="Search task for to do">
            </label>
        </form>
    </header>
    <main>
        <nav class="navbar">
            <ul class="nav_list">
                <li class="nav_item"><a class="nav_link" href="#">All</a></li>
                <li class="nav_item"><a class="nav_link" href="#">Active</a></li>
                <li class="nav_item"><a class="nav_link" href="#">Done</a></li>
            </ul>
        </nav>
        <div class="new_task">
            <form class="add_new_task" action="/addTask">
                <label class="new_task_label" for="newTask">New Task</label>
                <textarea id="newTask" required></textarea>
                <input class="add_new_task_input" type="submit" value="ADD"/>
            </form>
        </div>
        <div>
            <ul class="task_list">

            </ul>
        </div>
    </main>
</div>
</body>
</html>
